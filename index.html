<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>專案進度追蹤系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #263238;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* =========================
       Sidebar
    ========================= */

    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e5e9ef;
      padding: 24px 18px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 20;
    }

    .logo {
      padding: 4px 10px 24px;
    }

    .logo h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: #263238;
    }

    .logo p {
      margin: 6px 0 0;
      color: #8a949e;
      font-size: 12px;
    }

    .sidebar-section-title {
      padding: 0 10px;
      margin: 15px 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #9aa3ad;
    }

    .sidebar-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 11px 12px;
      border-radius: 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4d5964;
      font-size: 14px;
      transition: 0.2s;
    }

    .sidebar-btn:hover {
      background: #f3f6fa;
    }

    .sidebar-btn.primary {
      background: #263238;
      color: #fff;
      justify-content: center;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .sidebar-btn.primary:hover {
      background: #37474f;
    }

    .sidebar-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      color: #66717c;
      font-size: 13px;
    }

    .stat-number {
      min-width: 25px;
      height: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #edf1f5;
      color: #45515c;
      font-size: 12px;
      font-weight: 700;
    }

    .project-list {
      margin-top: 8px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 9px 10px;
      text-align: left;
      color: #59656f;
      margin-bottom: 3px;
    }

    .project-item:hover {
      background: #f5f7fa;
    }

    .project-item.active {
      background: #eaf2ff;
      color: #2365c7;
      font-weight: 700;
    }

    .project-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8fa0ae;
      flex: 0 0 auto;
    }

    .project-item.active .project-dot {
      background: #4285f4;
    }

    .project-item.completed .project-dot {
      background: #55a96d;
    }

    .project-name-small {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* =========================
       Main
    ========================= */

    .main {
      margin-left: 280px;
      flex: 1;
      padding: 30px 34px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .breadcrumb {
      color: #8b959e;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      margin: 0;
      color: #263238;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid #dce2e8;
      background: #fff;
      color: #45515c;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      background: #f5f7fa;
    }

    .btn.dark {
      background: #263238;
      color: white;
      border-color: #263238;
    }

    .btn.dark:hover {
      background: #37474f;
    }

    .btn.danger {
      color: #c53c3c;
      border-color: #efcccc;
      background: #fff;
    }

    .btn.danger:hover {
      background: #fff3f3;
    }

    .btn.small {
      padding: 6px 10px;
      font-size: 12px;
    }

    /* =========================
       Firebase status
    ========================= */

    .firebase-status {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 100;
      background: rgba(38, 50, 56, 0.94);
      color: white;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .firebase-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffb300;
    }

    .firebase-status.connected .firebase-status-dot {
      background: #61c67a;
    }

    .firebase-status.error .firebase-status-dot {
      background: #ef5350;
    }

    /* =========================
       Project header
    ========================= */

    .project-header-card {
      background: white;
      border: 1px solid #e6eaf0;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      align-items: flex-start;
    }

    .project-header-left {
      min-width: 0;
    }

    .project-header h2 {
      margin: 0 0 12px;
      font-size: 25px;
      color: #263238;
      word-break: break-word;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #74808a;
      font-size: 13px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-active {
      background: #e9f4ff;
      color: #2876c9;
    }

    .status-completed {
      background: #e9f7ed;
      color: #38864f;
    }

    .project-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    /* =========================
       Cards
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, .8fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e6eaf0;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 17px;
    }

    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #263238;
    }

    .card-subtitle {
      font-size: 12px;
      color: #9aa3ac;
      margin-top: 3px;
    }

    /* =========================
       Progress
    ========================= */

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .progress-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background:
        conic-gradient(
          #4f8df7 var(--progress, 0%),
          #e9edf2 var(--progress, 0%)
        );
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .progress-circle::before {
      content: "";
      position: absolute;
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: white;
    }

    .progress-circle-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .progress-number {
      font-size: 28px;
      font-weight: 800;
      color: #263238;
    }

    .progress-label {
      color: #8d979f;
      font-size: 11px;
    }

    .progress-info {
      flex: 1;
    }

    .progress-info h4 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .progress-info p {
      margin: 0;
      color: #87919a;
      line-height: 1.7;
      font-size: 13px;
    }

    .progress-bar {
      height: 9px;
      background: #edf0f3;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar-inner {
      height: 100%;
      background: #4f8df7;
      border-radius: inherit;
      transition: width .3s;
    }

    /* =========================
       TODO
    ========================= */

    .todo-list {
  display: flex;
  flex-direction: column;
  gap: 9px;

  /* 超過畫面寬度時可以左右拖曳 */
  overflow-x: auto;
  overflow-y: visible;

  /* 保留底部水平捲軸空間 */
  padding-bottom: 8px;

  width: 100%;
}


/* 每一筆待辦事項改成橫向排列 */
.todo-row {
  min-width: 900px;

  border: 1px solid #e9edf1;
  border-radius: 11px;
  background: #fff;
  overflow: hidden;
}


/* 待辦主要內容改成橫向 */
.todo-main {
  display: flex;
  align-items: center;
  gap: 14px;

  min-height: 68px;
  padding: 12px 15px;

  width: 100%;
}


/* 勾選框 */
.todo-check {
  appearance: none;

  width: 19px;
  height: 19px;

  border: 2px solid #bdc6ce;
  border-radius: 5px;

  margin: 0;

  flex: 0 0 auto;

  cursor: pointer;
  position: relative;
  background: white;
}


/* 待辦內容區 */
.todo-content {
  display: flex;
  align-items: center;
  gap: 15px;

  flex: 1;

  min-width: 0;
}


/* 待辦名稱 */
.todo-name {
  width: 230px;
  min-width: 230px;

  font-size: 14px;
  font-weight: 700;

  color: #36414a;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* 原本上下排列的資訊改成橫向 */
.todo-info {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;

  gap: 7px;

  margin-top: 0;

  white-space: nowrap;
}


/* 備註改成橫向欄位 */
.todo-note {
  width: 260px;
  min-width: 260px;

  color: #9099a1;
  font-size: 12px;

  margin-top: 0;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* 編輯按鈕固定在最右側 */
.todo-actions {
  display: flex;
  gap: 4px;

  margin-left: auto;

  flex: 0 0 auto;
}


/* 子任務 */
.subtasks {
  border-top: 1px solid #edf0f2;

  background: #fafbfc;

  padding: 10px 15px 10px 48px;

  display: flex;
  flex-wrap: nowrap;
  gap: 18px;

  min-width: 900px;

  overflow-x: auto;
}


.subtask-row {
  display: flex;
  align-items: center;

  gap: 8px;

  margin: 0;

  font-size: 12px;
  color: #67727c;

  white-space: nowrap;
}


/* 水平捲軸樣式 */
.todo-list::-webkit-scrollbar,
.subtasks::-webkit-scrollbar {
  height: 8px;
}

.todo-list::-webkit-scrollbar-track,
.subtasks::-webkit-scrollbar-track {
  background: #f1f3f5;
  border-radius: 10px;
}

.todo-list::-webkit-scrollbar-thumb,
.subtasks::-webkit-scrollbar-thumb {
  background: #c4cbd1;
  border-radius: 10px;
}

.todo-list::-webkit-scrollbar-thumb:hover,
.subtasks::-webkit-scrollbar-thumb:hover {
  background: #aab3bb;
}

    .todo-row {
      border: 1px solid #e9edf1;
      border-radius: 11px;
      background: #fff;
      overflow: hidden;
    }

    .todo-main {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px;
    }

    .todo-check {
      appearance: none;
      width: 19px;
      height: 19px;
      border: 2px solid #bdc6ce;
      border-radius: 5px;
      margin: 1px 0 0;
      flex: 0 0 auto;
      cursor: pointer;
      position: relative;
      background: white;
    }

    .todo-check:checked {
      border-color: #4f8df7;
      background: #4f8df7;
    }

    .todo-check:checked::after {
      content: "✓";
      position: absolute;
      color: white;
      font-size: 13px;
      left: 2px;
      top: -1px;
      font-weight: 800;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-name {
      font-size: 14px;
      font-weight: 700;
      color: #36414a;
      word-break: break-word;
    }

    .todo-name.completed {
      text-decoration: line-through;
      color: #9ca5ad;
    }

    .todo-info {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }

    .todo-tag {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      background: #f2f4f6;
      color: #78838d;
    }

    .priority-high {
      background: #fff0ef;
      color: #d3544e;
    }

    .priority-medium {
      background: #fff6e5;
      color: #b27a1e;
    }

    .priority-low {
      background: #edf7f0;
      color: #4f9162;
    }

    .todo-note {
      color: #9099a1;
      font-size: 12px;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .todo-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: #8c969f;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      font-size: 14px;
    }

    .icon-btn:hover {
      background: #f2f4f7;
      color: #46515b;
    }

    .subtasks {
      border-top: 1px solid #edf0f2;
      background: #fafbfc;
      padding: 10px 13px 11px 43px;
    }

    .subtask-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
      font-size: 12px;
      color: #67727c;
    }

    .subtask-row input {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1px solid #b9c1c8;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .subtask-row input:checked {
      background: #7e9ecf;
      border-color: #7e9ecf;
    }

    .subtask-row input:checked::after {
      content: "✓";
      color: white;
      font-size: 10px;
      position: absolute;
      left: 2px;
      top: 0;
    }

    .subtask-row span.done {
      text-decoration: line-through;
      color: #a3abb2;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #9aa3aa;
      font-size: 13px;
    }

    /* =========================
       Deadline
    ========================= */

    .deadline-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .deadline-row {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #edf0f3;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .deadline-date {
      width: 44px;
      height: 44px;
      border-radius: 9px;
      background: #f1f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .deadline-day {
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }

    .deadline-month {
      font-size: 9px;
      color: #89939b;
      margin-top: 2px;
    }

    .deadline-info {
      min-width: 0;
      flex: 1;
    }

    .deadline-name {
      font-size: 12px;
      font-weight: 700;
      color: #505b64;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .deadline-meta {
      color: #9aa3aa;
      font-size: 10px;
      margin-top: 3px;
    }

    .deadline-overdue {
      color: #d9534f;
    }

    /* =========================
       Modal
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 33, 40, .45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 70px rgba(0,0,0,.18);
    }

    .modal.small {
      max-width: 480px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 22px;
      border-bottom: 1px solid #edf0f3;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      background: #f3f5f7;
      border-radius: 8px;
      color: #64717a;
      font-size: 18px;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 15px 22px;
      border-top: 1px solid #edf0f3;
    }

    .modal-footer-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: #5c6872;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      border: 1px solid #dce2e7;
      border-radius: 9px;
      padding: 10px 11px;
      background: white;
      color: #35414a;
      outline: none;
      font-size: 13px;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: #7da8e8;
      box-shadow: 0 0 0 3px rgba(79,141,247,.1);
    }

    .form-textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .subtask-editor {
      border: 1px solid #e6ebef;
      border-radius: 10px;
      padding: 12px;
      background: #fafbfc;
    }

    .subtask-editor-row {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }

    .subtask-editor-row:last-child {
      margin-bottom: 0;
    }

    .owner-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .owner-row {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e7ebef;
      border-radius: 9px;
      padding: 9px 10px;
    }

    .owner-row-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .owner-add {
      display: flex;
      gap: 7px;
    }

    .owner-add input {
      flex: 1;
    }

    /* =========================
       Loading
    ========================= */

    .loading-screen {
      min-height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c969e;
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 3px solid #e7ebef;
      border-top-color: #4f8df7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      background: #fff4f3;
      border: 1px solid #f0ceca;
      border-radius: 12px;
      padding: 16px;
      color: #a94442;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       Mobile
    ========================= */

    .mobile-menu-btn {
      display: none;
      border: 0;
      background: white;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      font-size: 18px;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .main {
        padding: 15px;

<!-- =========================
     FIREBASE + APPLICATION
========================== -->

<script type="module">

/* =========================================================
   Firebase Browser SDK
   注意：
   這裡不能使用 Firebase Console 給 npm / bundler 的：
   import { initializeApp } from "firebase/app";

   GitHub Pages 直接執行 HTML，因此使用 gstatic CDN。
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  deleteDoc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =========================================================
   Firebase Config
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCgY3LT-O3NYIyl6jcjAjzY84aTerMpmtA",

  authDomain:
    "task-tracker-4cb4d.firebaseapp.com",

  projectId:
    "task-tracker-4cb4d",

  storageBucket:
    "task-tracker-4cb4d.firebasestorage.app",

  messagingSenderId:
    "11997228104",

  appId:
    "1:11997228104:web:9caa6e8485bcebc1d7fc7d",

  measurementId:
    "G-S9SZJ5Y5V6"
};


/* =========================================================
   Firebase 初始化
   只初始化一次
========================================================= */

let firebaseApp = null;
let db = null;
let auth = null;

let firebaseReady = false;
let firebaseLoading = true;


/* =========================================================
   Firestore 設定
========================================================= */

const PROJECT_COLLECTION =
  "projectTracker";

const SETTINGS_COLLECTION =
  "projectTrackerSettings";

const SETTINGS_DOCUMENT =
  "main";


/* =========================================================
   App Data
========================================================= */

let data = {

  owners: [],

  projects: []

};

let currentProjectId = null;

let unsubscribeProjects = null;
let unsubscribeSettings = null;


/* =========================================================
   Utility
========================================================= */

function createId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2, 8)
  );

}


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatDate(dateString) {

  if (!dateString) {
    return "未設定";
  }

  const date =
    new Date(dateString + "T00:00:00");

  if (Number.isNaN(date.getTime())) {
    return dateString;
  }

  return (
    date.getFullYear() +
    "/" +
    String(date.getMonth() + 1).padStart(2, "0") +
    "/" +
    String(date.getDate()).padStart(2, "0")
  );

}


function formatMonth(dateString) {

  if (!dateString) {
    return "";
  }

  const date =
    new Date(dateString + "T00:00:00");

  return (
    String(date.getMonth() + 1).padStart(2, "0") +
    "月"
  );

}


function getTodayString() {

  const date = new Date();

  return (
    date.getFullYear() +
    "-" +
    String(date.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(date.getDate()).padStart(2, "0")
  );

}


function isOverdue(dateString) {

  if (!dateString) {
    return false;
  }

  return dateString < getTodayString();

}


/* =========================================================
   Firebase 初始化
========================================================= */

function initializeFirebase() {

  try {

    firebaseApp =
      initializeApp(firebaseConfig);

    db =
      getFirestore(firebaseApp);

    auth =
      getAuth(firebaseApp);

    console.log(
      "Firebase 初始化成功"
    );

  } catch (error) {

    console.error(
      "Firebase 初始化失敗：",
      error
    );

    setFirebaseStatus(
      "error",
      "Firebase 初始化失敗"
    );

  }

}


/* =========================================================
   Firebase Authentication
========================================================= */

async function initFirebase() {

  try {

    if (!firebaseApp || !db || !auth) {

      throw new Error(
        "Firebase 尚未成功初始化。"
      );

    }

    await signInAnonymously(auth);

    firebaseReady = true;
    firebaseLoading = false;

    setFirebaseStatus(
      "connected",
      "Firebase 已連線"
    );

    subscribeFirebase();

  } catch (error) {

    console.error(
      "Firebase 登入失敗：",
      error
    );

    firebaseLoading = false;

    setFirebaseStatus(
      "error",
      "Firebase 連線失敗"
    );

    showFirebaseConnectionError(error);

  }

}


/* =========================================================
   Firebase Status
========================================================= */

function setFirebaseStatus(
  type,
  text
) {

  const status =
    document.getElementById(
      "firebaseStatus"
    );

  const label =
    document.getElementById(
      "firebaseStatusText"
    );

  if (!status || !label) {
    return;
  }

  status.className =
    "firebase-status " + type;

  label.textContent = text;

}


function showFirebaseConnectionError(error) {

  const main =
    document.getElementById(
      "mainContent"
    );

  if (!main) {
    return;
  }

  let message =
    error?.message ||
    "Firebase 連線失敗。";

  if (
    error?.code ===
    "auth/operation-not-allowed"
  ) {

    message =
      "Firebase Anonymous Authentication 尚未啟用。請到 Firebase Console → Authentication → Sign-in method → Anonymous → Enable。";

  }

  else if (
    error?.code ===
    "permission-denied"
  ) {

    message =
      "Firestore 權限不足，請確認 Firestore Rules 是否允許已登入使用者讀寫。";

  }

  main.innerHTML = `

    <div class="error-box">

      <strong>
        Firebase 連線發生問題
      </strong>

      <br><br>

      ${escapeHtml(message)}

      <br><br>

      請開啟瀏覽器 F12 → Console 查看詳細錯誤。

    </div>

  `;

}


/* =========================================================
   Firestore 即時同步
========================================================= */

function subscribeFirebase() {

  if (!db) {
    return;
  }


  /* -------------------------
     Settings
  ------------------------- */

  const settingsRef =
    doc(
      db,
      SETTINGS_COLLECTION,
      SETTINGS_DOCUMENT
    );

  unsubscribeSettings =
    onSnapshot(
      settingsRef,

      async (snapshot) => {

        if (snapshot.exists()) {

          const settings =
            snapshot.data();

          data.owners =
            Array.isArray(settings.owners)
              ? settings.owners
              : [];

        }

        else {

          data.owners = [];

          await setDoc(
            settingsRef,
            {
              owners: [],
              updatedAt:
                serverTimestamp()
            },
            {
              merge: true
            }
          );

        }

        render();

      },

      (error) => {

        console.error(
          "Settings 監聽失敗：",
          error
        );

        setFirebaseStatus(
          "error",
          "設定資料同步失敗"
        );

      }
    );


  /* -------------------------
     Projects
  ------------------------- */

  const projectsRef =
    collection(
      db,
      PROJECT_COLLECTION
    );

  unsubscribeProjects =
    onSnapshot(

      projectsRef,

      (snapshot) => {

        const projects = [];

        snapshot.forEach(
          (docSnapshot) => {

            const raw =
              docSnapshot.data();

            projects.push(
              normalizeProject(
                raw,
                docSnapshot.id
              )
            );

          }
        );

        projects.sort(
          (a, b) =>
            (a.order ?? 0) -
            (b.order ?? 0)
        );

        data.projects =
          projects;

        if (
          !currentProjectId ||
          !data.projects.some(
            p =>
              p.id ===
              currentProjectId
          )
        ) {

          currentProjectId =
            data.projects.length
              ? data.projects[0].id
              : null;

        }

        render();

      },

      (error) => {

        console.error(
          "Projects 監聽失敗：",
          error
        );

        setFirebaseStatus(
          "error",
          "專案資料同步失敗"
        );

        showFirebaseConnectionError(
          error
        );

      }

    );

}


/* =========================================================
   Normalize Data
========================================================= */

function normalizeProject(
  raw,
  id
) {

  return {

    id,

    name:
      raw.name || "未命名專案",

    deadline:
      raw.deadline || "",

    owner:
      raw.owner || "",

    status:
      raw.status === "completed"
        ? "completed"
        : "active",

    order:
      typeof raw.order === "number"
        ? raw.order
        : 0,

    todos:
      Array.isArray(raw.todos)
        ? raw.todos.map(
            normalizeTodo
          )
        : []

  };

}


function normalizeTodo(todo) {

  return {

    id:
      todo?.id ||
      createId(),

    name:
      todo?.name ||
      "",

    deadline:
      todo?.deadline ||
      "",

    priority:
      ["high", "medium", "low"]
        .includes(todo?.priority)
        ? todo.priority
        : "medium",

    note:
      todo?.note ||
      "",

    completed:
      Boolean(
        todo?.completed
      ),

    subtasks:
      Array.isArray(
        todo?.subtasks
      )
        ? todo.subtasks.map(
            subtask => ({
              id:
                subtask?.id ||
                createId(),

              name:
                subtask?.name ||
                "",

              completed:
                Boolean(
                  subtask?.completed
                )
            })
          )
        : []

  };

}


/* =========================================================
   Firebase Save Functions
========================================================= */

async function saveProjectToFirebase(
  project
) {

  if (!firebaseReady || !db) {

    alert(
      "Firebase 尚未連線完成，請稍候再試。"
    );

    return false;

  }

  try {

    const projectRef =
      doc(
        db,
        PROJECT_COLLECTION,
        project.id
      );

    await setDoc(

      projectRef,

      {

        name:
          project.name,

        deadline:
          project.deadline,

        owner:
          project.owner,

        status:
          project.status,

        todos:
          project.todos,

        order:
          project.order ?? 0,

        updatedAt:
          serverTimestamp()

      },

      {
        merge: true
      }

    );

    return true;

  } catch (error) {

    console.error(
      "儲存專案失敗：",
      error
    );

    alert(
      getFirebaseErrorMessage(
        error
      )
    );

    return false;

  }

}


async function saveOwnersToFirebase() {

  if (!firebaseReady || !db) {

    return false;

  }

  try {

    const settingsRef =
      doc(
        db,
        SETTINGS_COLLECTION,
        SETTINGS_DOCUMENT
      );

    await setDoc(

      settingsRef,

      {

        owners:
          data.owners,

        updatedAt:
          serverTimestamp()

      },

      {
        merge: true
      }

    );

    return true;

  } catch (error) {

    console.error(
      "儲存負責人失敗：",
      error
    );

    alert(
      getFirebaseErrorMessage(
        error
      )
    );

    return false;

  }

}


async function removeProjectFromFirebase(
  projectId
) {

  if (!firebaseReady || !db) {
    return false;
  }

  try {

    await deleteDoc(
      doc(
        db,
        PROJECT_COLLECTION,
        projectId
      )
    );

    return true;

  } catch (error) {

    console.error(
      "刪除專案失敗：",
      error
    );

    alert(
      getFirebaseErrorMessage(
        error
      )
    );

    return false;

  }

}


function getFirebaseErrorMessage(
  error
) {

  if (
    error?.code ===
    "permission-denied"
  ) {

    return (
      "Firebase 權限不足。\n\n" +
      "請確認 Firestore Rules 是否設定正確。"
    );

  }

  if (
    error?.code ===
    "auth/operation-not-allowed"
  ) {

    return (
      "Anonymous Authentication 尚未啟用。\n\n" +
      "請到 Firebase Console → Authentication → Sign-in method → Anonymous → Enable。"
    );

  }

  return (
    "Firebase 操作失敗：\n" +
    (error?.message ||
      "未知錯誤")
  );

}


/* =========================================================
   Current Project
========================================================= */

function getCurrentProject() {

  return data.projects.find(
    project =>
      project.id ===
      currentProjectId
  ) || null;

}


/* =========================================================
   Progress Calculation
========================================================= */

function calculateProgress(
  project
) {

  if (
    !project ||
    !Array.isArray(project.todos) ||
    project.todos.length === 0
  ) {

    return 0;

  }

  const total =
    project.todos.length;

  const completed =
    project.todos.filter(
      todo =>
        todo.completed
    ).length;

  return Math.round(
    completed /
    total *
    100
  );

}


function calculateTodoProgress(
  todo
) {

  if (
    !todo.subtasks ||
    todo.subtasks.length === 0
  ) {

    return todo.completed
      ? 100
      : 0;

  }

  const completed =
    todo.subtasks.filter(
      item =>
        item.completed
    ).length;

  return Math.round(
    completed /
    todo.subtasks.length *
    100
  );

}


/* =========================================================
   Render
========================================================= */

function render() {

  renderSidebar();

  if (firebaseLoading) {

    renderLoading();

    return;

  }

  const project =
    getCurrentProject();

  if (!project) {

    renderEmptyState();

    return;

  }

  renderProject(project);

}


function renderLoading() {

  const main =
    document.getElementById(
      "mainContent"
    );

  main.innerHTML = `

    <div class="loading-screen">

      <div class="spinner"></div>

      正在連線 Firebase...

    </div>

  `;

}


function renderEmptyState() {

  const main =
    document.getElementById(
      "mainContent"
    );

  main.innerHTML = `

    <div class="card">

function renderTodoList(

) {

  const list =
    document.getElementById(
      "todoList"

    !project.todos ||
    project.todos.length === 0

        <button
          class="btn small"
          onclick="openTodoModal()"
        >

        </button>

    `;

    return;

  }


  list.innerHTML =
    project.todos.map(
      todo => {

        const todoProgress =
          calculateTodoProgress(
            todo
          );

        const priorityText = {

          high: "高",

          medium: "中",

          low: "低"

        }[todo.priority] || "中";


        return `

          <div class="todo-row">

            <div class="todo-main">

              <input

                  <span

                    重要程度：${priorityText}
                  </span>

                    todo.deadline
                      ? `
                        <span class="todo-tag">
                          截止：

                            todo.deadline

                        </span>
                      `
                      : ""

                        <span class="todo-tag">

                        </span>
                      `
                      : ""

/* =========================================================
   Deadline Render
========================================================= */

function renderDeadlineList(
  project
) {

  const list =
    document.getElementById(
      "deadlineList"
    );

  if (!list) {
    return;
  }

  const items = [];


  if (project.deadline) {

    items.push({

      name:
        "專案總截止日期",

      deadline:
        project.deadline,

      owner:
        project.owner

    });

  }


  project.todos.forEach(
    todo => {

      if (
        todo.deadline &&
        !todo.completed
      ) {

        items.push({

          name:
            todo.name,

          deadline:
            todo.deadline,

          owner:
            ""

        });

      }

    }
  );


  items.sort(
    (a, b) =>
      a.deadline.localeCompare(
        b.deadline
      )
  );


  if (items.length === 0) {

    list.innerHTML = `

      <div class="empty">
        目前沒有設定截止日期。
      </div>

    `;

    return;

  }


  list.innerHTML =
    items.map(
      item => {

        const date =
          new Date(
            item.deadline +
            "T00:00:00"
          );

        const day =
          String(
            date.getDate()
          );

        const month =
          formatMonth(
            item.deadline
          );

        const overdue =
          isOverdue(
            item.deadline
          );


        return `

          <div class="deadline-row">

            <div class="deadline-date">

              <div class="deadline-day">
                ${day}
              </div>

              <div class="deadline-month">
                ${month}
              </div>

            </div>

            <div class="deadline-info">

              <div class="deadline-name">
                ${escapeHtml(
                  item.name
                )}
              </div>

              <div
                class="
                  deadline-meta
                  ${
                    overdue
                      ? "deadline-overdue"
                      : ""
                  }
                "
              >
                ${overdue
                  ? "已逾期"
                  : "截止"}
                ・
                ${formatDate(
                  item.deadline
                )}
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}

/* =========================================================
   Save Project
========================================================= */

async function saveProject() {

  const name =
    document
      .getElementById(
        "projectName"
      )
      .value
      .trim();

  const owner =
    document
      .getElementById(
        "projectOwner"
      )
      .value;

  const deadline =
    document
      .getElementById(
        "projectDeadline"
      )
      .value;

  const status =
    document
      .getElementById(
        "projectStatus"
      )
      .value;

  const id =
    document
      .getElementById(
        "projectId"
      )
      .value;


  if (!name) {

    alert(
      "請輸入專案名稱。"
    );

    return;

  }


  /* -------------------------
     Edit
  ------------------------- */

  if (id) {

    const project =
      data.projects.find(
        item =>
          item.id === id
      );

    if (!project) {
      return;
    }

    const oldData =
      JSON.parse(
        JSON.stringify(project)
      );


    project.name =
      name;

    project.owner =
      owner;

    project.deadline =
      deadline;

    project.status =
      status;


    const success =
      await saveProjectToFirebase(
        project
      );


    if (!success) {

      Object.assign(
        project,
        oldData
      );

      render();

      return;

    }

  }


  /* -------------------------
     New
  ------------------------- */

  else {

    const project = {

      id:
        createId(),

      name,

      deadline,

      owner,

      status,

      todos: [],

      order:
        data.projects.length

    };


    const success =
      await saveProjectToFirebase(
        project
      );


    if (!success) {
      return;
    }


    data.projects.push(
      project
    );

    currentProjectId =
      project.id;

  }


  closeModal(
    "projectModal"
  );

  render();

}


/* =========================================================
   Delete Current Project
========================================================= */

async function deleteCurrentProject() {

  const id =
    document
      .getElementById(
        "projectId"
      )
      .value;

  if (!id) {
    return;
  }

  const project =
    data.projects.find(
      item =>
        item.id === id
    );

  if (!project) {
    return;
  }


  const confirmed =
    confirm(
      `確定要刪除專案「${project.name}」嗎？\n\n此操作無法復原。`
    );


  if (!confirmed) {
    return;
  }


  const success =
    await removeProjectFromFirebase(
      id
    );


  if (!success) {
    return;
  }


  data.projects =
    data.projects.filter(
      item =>
        item.id !== id
    );


  currentProjectId =
    data.projects.length
      ? data.projects[0].id
      : null;


  closeModal(
    "projectModal"
  );

  render();

}

    )
      .map(
        row => {

          const input =
            row.querySelector(
              ".subtask-name-input"
            );

          return {

            id:
              row.dataset.subtaskId ||
              createId(),

            name:
              input
                ? input.value.trim()
                : "",

            completed:
              false

          };

        }
      )
      .filter(
        subtask =>
          subtask.name
      );


  if (id) {

    const todo =
      project.todos.find(
        item =>
          item.id === id
      );

    if (!todo) {
      return;
    }


    const oldData =
      JSON.parse(
        JSON.stringify(todo)
      );


    todo.name =
      name;

    todo.deadline =
      deadline;

    todo.priority =
      priority;

    todo.note =
      note;


    /* 保留原本子任務完成狀態 */

    subtasks.forEach(
      subtask => {

        const old =
          oldData.subtasks.find(
            item =>
              item.id ===
              subtask.id
          );

        if (old) {

          subtask.completed =
            old.completed;

        }

      }
    );


    todo.subtasks =
      subtasks;


    if (
      todo.subtasks.length > 0 &&
      todo.subtasks.every(
        subtask =>
          subtask.completed
      )
    ) {

      todo.completed =
        true;

    }


    if (
      todo.subtasks.length > 0 &&
      todo.subtasks.some(
        subtask =>
          !subtask.completed
      )
    ) {

      todo.completed =
        false;

    }


    const success =
      await saveProjectToFirebase(
        project
      );


    if (!success) {

      Object.assign(
        todo,
        oldData
      );

      render();

      return;

    }

  }


  else {

    project.todos.push({

      id:
        createId(),

      name,

      deadline,

      priority,

      note,

      completed:
        false,

      subtasks

    });


    const success =
      await saveProjectToFirebase(
        project
      );


    if (!success) {

      project.todos.pop();

      render();

      return;

    }

  }


  closeModal(
    "todoModal"
  );

  render();

}


/* =========================================================
   Toggle TODO
========================================================= */

async function toggleTodo(
  todoId
) {

  const project =
    getCurrentProject();

  if (!project) {
    return;
  }


  const todo =
    project.todos.find(
      item =>
        item.id ===
        todoId
    );

  if (!todo) {
    return;
  }


  const oldValue =
    todo.completed;


  todo.completed =
    !todo.completed;


  if (
    todo.completed &&
    todo.subtasks.length
  ) {

    todo.subtasks.forEach(
      subtask => {
        subtask.completed =
          true;
      }
    );

  }


  if (
    !todo.completed &&
    todo.subtasks.length
  ) {

    todo.subtasks.forEach(
      subtask => {
        subtask.completed =
          false;
      }
    );

  }


  const success =
    await saveProjectToFirebase(
      project
    );


  if (!success) {

    todo.completed =
      oldValue;

    render();

  }

}


/* =========================================================
   Toggle Subtask
========================================================= */

async function toggleSubtask(
  todoId,
  subtaskId
) {

  const project =
    getCurrentProject();

  if (!project) {
    return;
  }


  const todo =
    project.todos.find(
      item =>
        item.id ===
        todoId
    );

  if (!todo) {
    return;
  }


  const subtask =
    todo.subtasks.find(
      item =>
        item.id ===
        subtaskId
    );

  if (!subtask) {
    return;
  }


  subtask.completed =
    !subtask.completed;


  if (
    todo.subtasks.length &&
    todo.subtasks.every(
      item =>
        item.completed
    )
  ) {

    todo.completed =
      true;

  }

  else {

    todo.completed =
      false;

  }


  await saveProjectToFirebase(
    project
  );

  render();

}


/* =========================================================
   Delete TODO
========================================================= */

async function deleteCurrentTodo() {

  const project =
    getCurrentProject();

  if (!project) {
    return;
  }


  const id =
    document
      .getElementById(
        "todoId"
      )
      .value;


  if (!id) {
    return;
  }


  const todo =
    project.todos.find(
      item =>
        item.id === id
    );


  if (!todo) {
    return;
  }


  const confirmed =
    confirm(
      `確定要刪除「${todo.name}」嗎？`
    );


  if (!confirmed) {
    return;
  }


  const oldTodos =
    [...project.todos];


  project.todos =
    project.todos.filter(
      item =>
        item.id !== id
    );


  const success =
    await saveProjectToFirebase(
      project
    );


  if (!success) {

    project.todos =
      oldTodos;

    render();

    return;

  }


  closeModal(
    "todoModal"
  );

  render();

}


/* =========================================================
   Owner Manager
========================================================= */

function openOwnerModal() {

  renderOwnerList();

  document.getElementById(
    "newOwnerName"
  ).value = "";

  openModal(
    "ownerModal"
  );

}


function renderOwnerList() {

  const list =
    document.getElementById(
      "ownerList"
    );

  if (!list) {
    return;
  }


  if (data.owners.length === 0) {

    list.innerHTML = `

      <div class="empty">
        目前尚未建立負責人。
      </div>

    `;

    return;

  }


  list.innerHTML =
    data.owners
      .map(
        (owner, index) => `

          <div class="owner-row">

            <div class="owner-row-name">
              ${escapeHtml(owner)}
            </div>

            <button
              class="btn small"
              type="button"
              onclick="editOwner(${index})"
            >
              修改
            </button>

            <button
              class="btn danger small"
              type="button"
              onclick="deleteOwner(${index})"
            >
              刪除
            </button>

          </div>

        `
      )
      .join("");

}


async function addOwner() {

  const input =
    document.getElementById(
      "newOwnerName"
    );

  const name =
    input.value.trim();


  if (!name) {

    alert(
      "請輸入負責人名稱。"
    );

    return;

  }


  if (
    data.owners.includes(
      name
    )
  ) {

    alert(
      "這個負責人已經存在。"
    );

    return;

  }


  data.owners.push(
    name
  );


  const success =
    await saveOwnersToFirebase();


  if (!success) {

    data.owners =
      data.owners.filter(
        owner =>
          owner !== name
      );

    return;

  }


  input.value = "";

  renderOwnerList();

  updateOwnerSelect();

}


async function editOwner(
  index
) {

  const oldName =
    data.owners[index];

  if (!oldName) {
    return;
  }


  const newName =
    prompt(
      "請輸入新的負責人名稱：",
      oldName
    );


  if (
    newName === null
  ) {
    return;
  }


  const cleanName =
    newName.trim();


  if (!cleanName) {

    alert(
      "負責人名稱不能為空白。"
    );

    return;

  }


  if (
    cleanName !== oldName &&
    data.owners.includes(
      cleanName
    )
  ) {

    alert(
      "這個負責人已經存在。"
    );

    return;

  }


  data.owners[index] =
    cleanName;


  /* 同步修改既有專案 */

  const affectedProjects =
    data.projects.filter(
      project =>
        project.owner ===
        oldName
    );


  affectedProjects.forEach(
    project => {
      project.owner =
        cleanName;
    }
  );


  const ownersSuccess =
    await saveOwnersToFirebase();


  if (!ownersSuccess) {

    data.owners[index] =
      oldName;

    affectedProjects.forEach(
      project => {
        project.owner =
          oldName;
      }
    );

    renderOwnerList();

    render();

    return;

  }


  for (
    const project
    of affectedProjects
  ) {

    await saveProjectToFirebase(
      project
    );

  }


  renderOwnerList();

  updateOwnerSelect();

  render();

}


async function deleteOwner(
  index
) {

  const owner =
    data.owners[index];

  if (!owner) {
    return;
  }


  const affectedProjects =
    data.projects.filter(
      project =>
        project.owner ===
        owner
    );


  const message =
    affectedProjects.length
      ? (
          `目前有 ${affectedProjects.length} 個專案使用「${owner}」。\n\n` +
          "刪除負責人後，這些專案的負責人會改成「尚未指定」。\n\n" +
          "確定要刪除嗎？"
        )
      : (
          `確定要刪除負責人「${owner}」嗎？`
        );


  if (!confirm(message)) {
    return;
  }


  data.owners.splice(
    index,
    1
  );


  affectedProjects.forEach(
    project => {
      project.owner = "";
    }
  );


  const ownersSuccess =
    await saveOwnersToFirebase();


  if (!ownersSuccess) {

    data.owners.splice(
      index,
      0,
      owner
    );

    affectedProjects.forEach(
      project => {
        project.owner =
          owner;
      }
    );

    renderOwnerList();

    render();

    return;

  }


  for (
    const project
    of affectedProjects
  ) {

    await saveProjectToFirebase(
      project
    );

  }


  renderOwnerList();

  updateOwnerSelect();

  render();

}


/* =========================================================
   Modal
========================================================= */

function openModal(
  id
) {

  document
    .getElementById(id)
    ?.classList.add(
      "show"
    );

}


function closeModal(
  id
) {

  document
    .getElementById(id)
    ?.classList.remove(
      "show"
    );

}


function handleBackdropClick(
  event,
  modalId
) {

  if (
    event.target.id ===
    modalId
  ) {

    closeModal(
      modalId
    );

  }

}


/* =========================================================
   Sidebar Mobile
========================================================= */

function toggleSidebar() {

  document
    .getElementById(
      "sidebar"
    )
    ?.classList.toggle(
      "open"
    );

}


/* =========================================================
   Keyboard
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .querySelectorAll(
          ".modal-backdrop.show"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "show"
            )
        );

    }

  }
);


/* =========================================================
   Window Functions
   因為 HTML onclick 需要能取得這些 function
========================================================= */

Object.assign(
  window,
  {

    openProjectModal,

    closeModal,

    saveProject,

    deleteCurrentProject,

    selectProject,

    openTodoModal,

    saveTodo,

    deleteCurrentTodo,

    toggleTodo,

    toggleSubtask,

    addSubtaskEditorRow,

    removeSubtaskEditorRow,

    openOwnerModal,

    addOwner,

    editOwner,

    deleteOwner,

    toggleSidebar,

    handleBackdropClick

  }
);


/* =========================================================
   Start
========================================================= */

initializeFirebase();

initFirebase();

</script>
